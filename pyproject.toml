[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-chat-export"
version = "0.1.0"
description = "Export local Codex Desktop conversations as Markdown or JSON."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "haoc" }
]
keywords = ["codex", "chat-export", "transcript", "skill", "openai"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/wimi321/codex-chat-export"
Repository = "https://github.com/wimi321/codex-chat-export"
Issues = "https://github.com/wimi321/codex-chat-export/issues"

[project.scripts]
codex-chat-export = "codex_chat_export:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
